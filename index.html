<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OurWorlds Login</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Quicksand', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #ffffff, #ff4da6);
    overflow: hidden;
  }
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .stars span {
    position: absolute;
    color: white;
    font-size: 18px;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0.8; }
  }
  .login-box {
    position: relative;
    background: #ff2e93;
    border: 3px solid white;
    border-radius: 20px;
    padding: 40px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.7), inset 0 0 15px rgba(255,255,255,0.3);
    color: white;
  }
  input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: 2px solid white;
    outline: none;
  }
  button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 15px;
    background: white;
    color: #ff2e93;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { transform: scale(1.05); }
  .links { margin-top: 15px; font-size: 12px; }
  .links a { color: white; }
  #gurt { position: absolute; width: 70px; opacity: 0.5; pointer-events: none; }
</style>
</head>

<body>

<!-- STARS BACKGROUND -->
<div class="stars">
  <span style="left:10%; animation-duration:6s;">★</span>
  <span style="left:30%; animation-duration:8s;">☆</span>
  <span style="left:50%; animation-duration:5s;">★</span>
  <span style="left:70%; animation-duration:7s;">☆</span>
</div>

<!-- LOGIN BOX -->
<div class="login-box">
  <img src="logo.PNG" class="logo" alt="OurWorlds Logo" width="300">
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="links">
    <a href="OurWorlds_registration.html">Create account</a>
  </div>
</div>

<!-- GURT ANIMATION -->
<img src="gurt.png" id="gurt">

<script>
/* ================= LOGIN FUNCTION ================= */
async function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (!user || !pass) {
    alert("Please enter both username and password!");
    return;
  }

  try {
    const res = await fetch("http://192.168.254.128:3000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });

    const contentType = res.headers.get("content-type");

    if (contentType && contentType.includes("application/json")) {
      const data = await res.json();

      // 🔐 MFA FLOW
      if (data.status === "MFA_REQUIRED") {
        localStorage.setItem("pendingUser", user);
        window.location.href = "mfa.html";
        return;
      }

      // ✅ FULL LOGIN SUCCESS (NO MFA)
      localStorage.setItem("username", user);
      localStorage.removeItem("pendingUser");

      if (data.profileIcon) {
        localStorage.setItem("pfpUrl", data.profileIcon);
      }

      if (data.displayName) {
        localStorage.setItem("displayName", data.displayName);
      }

      window.location.href = "index.html"; // your homepage
      return;
    }

    // ❌ ERROR (plain text)
    const errorMessage = await res.text();
    alert(errorMessage);

  } catch (err) {
    console.error("Login Error:", err);
    alert("Server not reachable. Make sure your Backend VM is running!");
  }
}

/* ================= GURT ANIMATION LOGIC ================= */
(() => {
  const gurt = document.getElementById("gurt");
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  let dx = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);
  let dy = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);
  let angle = 0;
  let dAngle = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);

  function moveGurt() {
    x += dx; y += dy; angle += dAngle;
    if (x < -70 || x > window.innerWidth) dx *= -1;
    if (y < -70 || y > window.innerHeight) dy *= -1;
    gurt.style.left = x + "px";
    gurt.style.top = y + "px";
    gurt.style.transform = `rotate(${angle}deg)`;
    requestAnimationFrame(moveGurt);
  }
  moveGurt();
})();
</script>

</body>
</html>
