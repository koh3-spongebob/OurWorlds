<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OurWorlds Login</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Quicksand', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #ffffff, #ff4da6);
    overflow: hidden;
  }

  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .stars span {
    position: absolute;
    color: white;
    font-size: 18px;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0.8; }
  }

  .login-box {
    position: relative;
    background: #ff2e93;
    border: 3px solid white;
    border-radius: 20px;
    padding: 40px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.7), inset 0 0 15px rgba(255,255,255,0.3);
    color: white;
  }

  input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border: 2px solid white;
    outline: none;
  }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 15px;
    background: white;
    color: #ff2e93;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    transform: scale(1.05);
  }

  .links {
    margin-top: 15px;
    font-size: 12px;
  }

  .links a {
    color: white;
  }

  #gurt {
    position: absolute;
    width: 70px;
    opacity: 0.5;
    pointer-events: none;
  }
</style>
</head>

<body>

<!-- STARS -->
<div class="stars">
  <span style="left:10%; animation-duration:6s;">★</span>
  <span style="left:30%; animation-duration:8s;">☆</span>
  <span style="left:50%; animation-duration:5s;">★</span>
  <span style="left:70%; animation-duration:7s;">☆</span>
</div>

<!-- LOGIN -->
<div class="login-box">
  <img src="logo.PNG" class="logo" alt="OurWorlds Logo" width="300">

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div class="links">
    <a href="OurWorlds_registration.html">Create account</a>
  </div>
</div>

<!-- GURT -->
<img src="gurt.png" id="gurt">

<script>
/* ================= LOGIN ================= */
async function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  try {
    const res = await fetch("http://192.168.206.129:3000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });

    const data = await res.json(); // Use .json() instead of .text()

    if (data.status === "MFA_REQUIRED") {
      // Save username for the next page
      localStorage.setItem("pendingUser", user);
      // Go to the code entry page
      window.location.href = "mfa_entry.html";
    } else {
      alert(data); 
    }
  } catch (err) {
    console.log(err);
    alert("Server not reachable");
  }
}
    });

    const text = await res.text();

    if (text === "Login successful") {
      window.location.href = "OurWorlds_homepage.html";
    } else {
      alert(text);
    }

  } catch (err) {
    console.log(err);
    alert("Server not reachable");
  }
}

/* ================= GURT ANIMATION ================= */
(() => {
  const gurt = document.getElementById("gurt");

  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;

  let dx = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);
  let dy = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);

  let angle = 0;
  let dAngle = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1);

  function moveGurt() {
    x += dx;
    y += dy;
    angle += dAngle;

    if (x < -70 || x > window.innerWidth) dx *= -1;
    if (y < -70 || y > window.innerHeight) dy *= -1;

    gurt.style.left = x + "px";
    gurt.style.top = y + "px";
    gurt.style.transform = `rotate(${angle}deg)`;

    requestAnimationFrame(moveGurt);
  }

  moveGurt();
})();
</script>

</body>
</html>
