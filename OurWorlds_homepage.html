<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OurWorlds Home</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
  /* ... Keep your existing CSS ... */
  body { margin: 0; font-family: 'Quicksand', sans-serif; background: linear-gradient(to bottom, #ffffff, #ff4da6); display: flex; min-height: 100vh; overflow-x: hidden; }
  .container { display: flex; flex: 1; gap: 20px; padding: 20px; z-index: 1; overflow-y: auto; }
  .left-panel { width: 200px; background: #ff2e93; border-radius: 20px; border: 3px solid white; padding: 20px; flex-shrink: 0; }
  .user-profile img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid white; }
  
  /* NEW STYLES FOR POST BOX */
  .post-box {
    width: 500px;
    background: white;
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .post-box textarea {
    width: 95%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    resize: none;
    font-family: inherit;
  }
  .post-box button {
    margin-top: 10px;
    background: #ff2e93;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
  }
  
  /* MAIN FEED STYLES */
  .main-feed { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .search-bar { width: 500px; margin-bottom: 20px; position: relative; }
  .search-bar input { width: 100%; padding: 12px; border-radius: 20px; border: 2px solid #ff2e93; }
  .feed-post { width: 500px; background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; color: #ff2e93; }
  .post-header { display: flex; align-items: center; margin-bottom: 10px; }
  .post-header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
  
  /* ... Rest of your Gurt/Star CSS ... */
</style>
</head>
<body>

<div class="container">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <img src="logo.PNG" class="logo" style="width:100%">
    <div class="user-profile">
      <img src="user.png">
      <div id="display-username">@Guest</div>
    </div>
    <button>Profile</button>
    <button>Friends</button>
    <button onclick="logout()">Sign Out</button>
  </div>

  <!-- MAIN FEED -->
  <div class="main-feed">
    
    <!-- SEARCH BAR -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search users or #hashtags..." onkeyup="handleSearch(event)">
    </div>

    <!-- POST BOX -->
    <div class="post-box">
      <textarea id="postContent" rows="3" placeholder="What's happening in your world? (Use #hashtags!)"></textarea>
      <button onclick="submitPost()">Post ✨</button>
    </div>

    <!-- POSTS CONTAINER -->
    <div id="feed-container">
      <!-- Posts will appear here dynamically -->
      <div class="feed-post">Loading your world...</div>
    </div>
  </div>

  <!-- RIGHT SPACE (Gurt & Horoscope) -->
  <div class="right-space">
    <!-- Keep your Gurt and Horoscope HTML here -->
  </div>
</div>

<script>
  // 1. SET USERNAME ON LOAD
  const currentUser = localStorage.getItem("username") || "Guest";
  document.getElementById("display-username").textContent = "@" + currentUser;

  const API_URL = "http://192.168.206.129:3000";

  // 2. SUBMIT A POST
  async function submitPost() {
    const content = document.getElementById("postContent").value;
    if (!content) return;

    try {
      const res = await fetch(`${API_URL}/post`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: currentUser, content })
      });
      
      if (res.ok) {
        document.getElementById("postContent").value = "";
        alert("Posted to the stars! ★");
        location.reload(); // Refresh to see new post
      }
    } catch (err) {
      alert("Post failed. Is the server running?");
    }
  }

  // 3. SEARCH LOGIC
  async function handleSearch(event) {
    if (event.key === "Enter") {
      const query = document.getElementById("searchInput").value;
      const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();
      
      const container = document.getElementById("feed-container");
      container.innerHTML = `<h3>Search Results for "${query}"</h3>`;

      // Show found Users
      data.users.forEach(u => {
        container.innerHTML += `<div class="feed-post">User Found: <strong>@${u.username}</strong> <button onclick="addFriend('${u.username}')">Add Friend</button></div>`;
      });

      // Show found Posts (Hashtags)
      data.posts.forEach(p => {
        container.innerHTML += `
          <div class="feed-post">
            <div class="post-header"><strong>@${p.author}</strong></div>
            <div>${p.content}</div>
          </div>`;
      });
    }
  }

  // 4. ADD FRIEND LOGIC
  async function addFriend(friendName) {
    await fetch(`${API_URL}/add-friend`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: currentUser, friendName })
    });
    alert("Friend Added!");
  }

  function logout() {
    localStorage.clear();
    window.location.href = "index.html";
  }

  // ... Keep your Horoscope script here ...
</script>
</body>
</html>
