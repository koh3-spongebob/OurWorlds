<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurWorlds Home ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(to bottom, #ffffff, #ff4da6);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== FALLING STARS BACKGROUND ===== */
  .feed-stars {
    position: absolute; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .feed-stars span {
    position: absolute; color: #ffffff; font-size: 20px;
    opacity: 0.3; animation: fallFeed linear infinite;
  }
  @keyframes fallFeed {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 0.3; }
    100% { transform: translateY(110vh); opacity: 0; }
  }

  .container { display: flex; flex: 1; gap: 20px; padding: 20px; z-index: 1; position: relative; }

  /* ===== LEFT SIDEBAR ===== */
  .left-panel {
    width: 220px; background: #ff2e93; border-radius: 25px;
    border: 3px solid white; box-shadow: 0 0 25px rgba(255,255,255,0.7);
    padding: 20px; position: sticky; top: 20px; flex-shrink: 0; height: fit-content;
  }

  .logo { width: 100%; margin-bottom: 15px; border-radius: 10px; }
  .user-profile { text-align: center; margin-bottom: 20px; color: white; }
  .user-profile img { 
    width: 80px; height: 80px; border-radius: 50%; 
    border: 3px solid white; background: white; object-fit: cover; 
  }

  /* BUTTON STAR HOVER LOGIC */
  .left-panel button {
    width: 100%; margin: 8px 0; padding: 12px; border: none; border-radius: 25px;
    font-weight: bold; color: white; background: linear-gradient(to bottom, #ff8acc, #ff2e93);
    cursor: pointer; box-shadow: 0 6px #d40070, 0 -2px 6px rgba(255,255,255,0.4) inset;
    transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  
  .left-panel button::before { content: "☆"; }
  .left-panel button:hover { transform: translateY(-2px); box-shadow: 0 8px #d40070; }
  .left-panel button:hover::before { content: "★"; color: #fff; }

  /* ===== MAIN FEED AREA ===== */
  .main-feed { flex: 1; max-width: 650px; margin: 0 auto; }
  .search-bar input {
    width: 100%; padding: 15px; border-radius: 30px; border: 3px solid #ff2e93;
    outline: none; font-family: inherit; margin-bottom: 20px; box-sizing: border-box;
  }
  .post-box {
    background: white; border-radius: 20px; padding: 20px;
    margin-bottom: 25px; box-shadow: 0 8px 20px rgba(255,77,166,0.2);
  }
  .post-box textarea {
    width: 100%; border-radius: 15px; border: 2px solid #ffcae5; padding: 15px;
    font-family: inherit; resize: none; box-sizing: border-box; outline: none;
  }
  .post-box button {
    margin-top: 10px; background: #ff2e93; color: white; border: none;
    padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; float: right;
  }

  .feed-post {
    background: white; border-radius: 20px; padding: 20px;
    margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #444;
  }
  .post-header { display: flex; align-items: center; margin-bottom: 12px; }
  .post-header img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 2px solid #ff2e93; object-fit: cover; }
  .post-header strong { color: #ff2e93; }

  /* POST STAR HOVER */
  .star-btn {
    margin-top: 10px; background: #fff0f6; border: 1px solid #ffcae5;
    padding: 6px 15px; border-radius: 15px; color: #ff2e93; font-weight: bold;
    cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
  }
  .star-btn:hover { background: #ff2e93; color: white; transform: scale(1.05); }
  .star-btn.active { background: #ff2e93; color: white; }

  /* ===== GURT AI VISUALS ===== */
  #gurt {
    position: fixed; bottom: 30px; right: 40px; width: 140px;
    z-index: 1001; cursor: pointer;
    animation: spinGurt 15s linear infinite;
  }
  @keyframes spinGurt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes thinkGurt { 0% { transform: scale(1); } 50% { transform: scale(1.2) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }

  .speech-bubble {
    position: fixed; bottom: 180px; right: 40px; width: 220px;
    padding: 15px; background: white; border-radius: 20px;
    color: #ff2e93; font-size: 14px; z-index: 6;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid #ff2e93;
  }

  #gurt-chat-window {
    position: fixed; bottom: 100px; right: 30px; width: 320px; height: 450px;
    background: white; border: 4px solid #ff2e93; border-radius: 25px;
    display: none; flex-direction: column; z-index: 1005; overflow: hidden;
    box-shadow: 0 15px 40px rgba(255, 46, 147, 0.4);
  }
  .chat-header { background: #ff2e93; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  #chat-history { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fffafc; }
  .msg { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; }
  .msg.user { background: #ffcae5; align-self: flex-end; color: #d40070; border-bottom-right-radius: 2px; }
  .msg.gurt { background: #f0f0f0; align-self: flex-start; color: #333; border-bottom-left-radius: 2px; border: 1px solid #ffcae5; }
  .chat-input-area { padding: 12px; border-top: 2px solid #ffcae5; display: flex; gap: 8px; background: white; }
  .chat-input-area input { flex: 1; border: 2px solid #ffcae5; border-radius: 20px; padding: 10px 15px; outline: none; font-family: inherit; }
  .chat-input-area button { background: #ff2e93; border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: bold; }

  .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
  .modal-content { background: white; margin: 10% auto; padding: 30px; width: 350px; border-radius: 25px; text-align: center; border: 4px solid #ff2e93; }
  .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 2px solid #ffcae5; box-sizing: border-box; }
</style>
</head>
<body>

<div class="feed-stars" id="star-bg"></div>

<div class="container">
  <div class="left-panel">
    <img src="logo.PNG" class="logo" alt="OurWorlds">
    <div class="user-profile">
      <img src="user.png" id="userPfp">
      <div id="display-username">@Guest</div>
    </div>
    <button onclick="openProfile()">Profile</button>
    <button onclick="alert('Coming soon!')">Friends</button>
    <button onclick="alert('Coming soon!')">Worlds</button>
    <button onclick="alert('Coming soon!')">Constellations</button>
    <button onclick="toggleChat()">Talk to Gurt!</button>
    <button onclick="logout()">Sign Out</button>
  </div>

  <div class="main-feed">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search the galaxy..." onkeyup="handleSearch(event)">
    </div>
    <div class="post-box">
      <textarea id="postContent" rows="3" placeholder="What's happening in your world?"></textarea>
      <button onclick="submitPost()">Post ✨</button>
      <div style="clear:both;"></div>
    </div>
    <div id="feed-container"></div>
  </div>

  <div class="right-space">
    <div class="speech-bubble">
      <strong id="gurt-status">✨ Star Wisdom:</strong>
      <p id="affirmation-text">Receiving signal...</p>
    </div>
    <img src="gurtHOMEPAGE.png" id="gurt" onclick="toggleChat()">
  </div>
</div>

<div id="gurt-chat-window">
  <div class="chat-header">
    <span>✨ Gurt Chat</span>
    <span style="cursor:pointer; font-size: 20px;" onclick="toggleChat()">×</span>
  </div>
  <div id="chat-history">
    <div class="msg gurt">Meow! Use the radio to talk to me! 🐾</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="gurtInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">➔</button>
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-content">
    <h2 style="color:#ff2e93;">Edit Profile ✨</h2>
    <input type="text" id="newDisplayName" placeholder="Display Name">
    <input type="text" id="newPfpUrl" placeholder="Profile Image URL">
    <div style="margin-top:15px;">
      <button onclick="saveProfile()" id="saveBtn" style="background:#ff2e93; color:white; padding:10px 20px; border:none; border-radius:15px; cursor:pointer;">Save</button>
      <button onclick="closeProfile()" style="background:#ccc; color:white; padding:10px 20px; border:none; border-radius:15px; cursor:pointer; margin-left:10px;">Cancel</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "http://192.168.174.129:3000";
  const currentUser = localStorage.getItem("username") || "Guest";

  function createStars() {
    const bg = document.getElementById('star-bg');
    for(let i=0; i<20; i++) {
        let s = document.createElement('span');
        s.textContent = i % 2 === 0 ? "☆" : "★";
        s.style.left = Math.random() * 100 + "%";
        s.style.animationDuration = (Math.random() * 5 + 5) + "s";
        s.style.animationDelay = Math.random() * 5 + "s";
        bg.appendChild(s);
    }
  }

  function toggleChat() {
    const win = document.getElementById("gurt-chat-window");
    win.style.display = (win.style.display === "flex") ? "none" : "flex";
  }

  async function sendChat() {
    const input = document.getElementById("gurtInput");
    const history = document.getElementById("chat-history");
    const gurtImg = document.getElementById("gurt");
    const val = input.value.trim();
    if(!val) return;

    history.innerHTML += `<div class="msg user">${val}</div>`;
    input.value = "";
    history.scrollTop = history.scrollHeight;
    gurtImg.style.animation = "thinkGurt 1s infinite linear";

    try {
      const res = await fetch(`${API_URL}/chat-with-gurt`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: val })
      });
      const data = await res.json();
      history.innerHTML += `<div class="msg gurt">${data.reply}</div>`;
    } catch (e) {
      history.innerHTML += `<div class="msg gurt">Error: Radio signal lost!</div>`;
    } finally {
      gurtImg.style.animation = "spinGurt 15s infinite linear";
      history.scrollTop = history.scrollHeight;
    }
  }

  function openProfile() { document.getElementById("profileModal").style.display = "block"; }
  function closeProfile() { document.getElementById("profileModal").style.display = "none"; }
  
  async function saveProfile() {
    const newName = document.getElementById("newDisplayName").value;
    const newPic = document.getElementById("newPfpUrl").value;
    await fetch(`${API_URL}/update-profile`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: currentUser, displayName: newName, profileIcon: newPic })
    });
    if(newName) localStorage.setItem("displayName", newName);
    if(newPic) localStorage.setItem("pfpUrl", newPic);
    location.reload();
  }

  async function loadFeed() {
    const savedName = localStorage.getItem("displayName");
    const savedPfp = localStorage.getItem("pfpUrl");
    document.getElementById("display-username").textContent = "@" + (savedName || currentUser);
    if(savedPfp) document.getElementById("userPfp").src = savedPfp;

    try {
      const res = await fetch(`${API_URL}/search?q=`);
      const data = await res.json();
      renderPosts(data.posts);
    } catch (e) { console.log("Feed offline"); }
  }

 function renderPosts(posts) {
    const container = document.getElementById("feed-container");
    container.innerHTML = "";
    posts.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(p => {
      const starred = p.stars && p.stars.includes(currentUser);
      
      // Use the new server fields!
      const displayName = p.authorDisplayName || p.author;
      const displayIcon = p.authorIcon || "user.png";

      container.innerHTML += `
        <div class="feed-post">
          <div class="post-header">
            <img src="${displayIcon}"> 
            <strong>@${displayName}</strong>
          </div>
          <div style="padding: 5px 0;">${p.content}</div>
          <button class="star-btn ${starred ? 'active' : ''}" onclick="starPost('${p._id}')">
            ${starred ? '★' : '☆'} ${p.stars ? p.stars.length : 0}
          </button>
        </div>`;
    });
}

  async function submitPost() {
    const content = document.getElementById("postContent").value;
    if(!content) return;
    await fetch(`${API_URL}/post`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: currentUser, content })
    });
    document.getElementById("postContent").value = "";
    loadFeed();
  }

  async function starPost(postId) {
    await fetch(`${API_URL}/star-post`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: currentUser, postId })
    });
    loadFeed();
  }

  async function handleSearch(e) {
    if(e.key === "Enter") {
        const q = document.getElementById("searchInput").value;
        const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderPosts(data.posts);
    }
  }

  function logout() { localStorage.clear(); window.location.href = "index.html"; }

  window.onload = () => {
    createStars();
    loadFeed();
  };
</script>
</body>
</html>
