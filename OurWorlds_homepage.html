<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurWorlds Home </title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(to bottom, #ffffff, #ff4da6);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== FALLING STARS BACKGROUND ===== */
  .feed-stars {
    position: absolute; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .feed-stars span {
    position: absolute; color: #ffffff; font-size: 20px;
    opacity: 0.3; animation: fallFeed linear infinite;
  }
  @keyframes fallFeed {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 0.3; }
    100% { transform: translateY(110vh); opacity: 0; }
  }

  .container { display: flex; flex: 1; gap: 20px; padding: 20px; z-index: 1; position: relative; }

  /* ===== LEFT SIDEBAR ===== */
  .left-panel {
    width: 220px; background: #ff2e93; border-radius: 25px;
    border: 3px solid white; box-shadow: 0 0 25px rgba(255,255,255,0.7);
    padding: 20px; position: sticky; top: 20px; flex-shrink: 0; height: fit-content;
  }

  .logo { width: 100%; margin-bottom: 15px; border-radius: 10px; }
  .user-profile { text-align: center; margin-bottom: 20px; color: white; }
  .user-profile img { 
    width: 80px; height: 80px; border-radius: 50%; 
    border: 3px solid white; background: white; object-fit: cover; 
  }

  /* BUTTON STAR HOVER LOGIC */
  .left-panel button {
    width: 100%; margin: 8px 0; padding: 12px; border: none; border-radius: 25px;
    font-weight: bold; color: white; background: linear-gradient(to bottom, #ff8acc, #ff2e93);
    cursor: pointer; box-shadow: 0 6px #d40070, 0 -2px 6px rgba(255,255,255,0.4) inset;
    transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  
  .left-panel button::before { content: "☆"; }
  .left-panel button:hover { transform: translateY(-2px); box-shadow: 0 8px #d40070; }
  .left-panel button:hover::before { content: "★"; color: #fff; }

  /* ===== MAIN FEED AREA ===== */
  .main-feed { flex: 1; max-width: 650px; margin: 0 auto; }
  .search-bar input {
    width: 100%; padding: 15px; border-radius: 30px; border: 3px solid #ff2e93;
    outline: none; font-family: inherit; margin-bottom: 20px; box-sizing: border-box;
  }
  .post-box {
    background: white; border-radius: 20px; padding: 20px;
    margin-bottom: 25px; box-shadow: 0 8px 20px rgba(255,77,166,0.2);
  }
  .post-box textarea {
    width: 100%; border-radius: 15px; border: 2px solid #ffcae5; padding: 15px;
    font-family: inherit; resize: none; box-sizing: border-box; outline: none;
  }
  .post-box button {
    margin-top: 10px; background: #ff2e93; color: white; border: none;
    padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; float: right;
  }

/* This makes hashtags in posts stand out */
  .hashtag-link {
    color: #ff2e93;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .hashtag-link:hover {
    text-decoration: underline;
  }

  
.add-friend-icon {
    cursor: pointer;
    margin-left: 10px;
    font-size: 1.1em;
    filter: grayscale(1);
    transition: 0.2s;
    display: inline-block;
  }
  .add-friend-icon:hover {
    filter: grayscale(0);
    transform: scale(1.3);
  }

  
  .feed-post {
    background: white; border-radius: 20px; padding: 20px;
    margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #444;
  }
  .post-header { display: flex; align-items: center; margin-bottom: 12px; }
  .post-header img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 2px solid #ff2e93; object-fit: cover; }
  .post-header strong { color: #ff2e93; }

  /* POST STAR HOVER */
  .star-btn {
    margin-top: 10px; background: #fff0f6; border: 1px solid #ffcae5;
    padding: 6px 15px; border-radius: 15px; color: #ff2e93; font-weight: bold;
    cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
  }
  .star-btn:hover { background: #ff2e93; color: white; transform: scale(1.05); }
  .star-btn.active { background: #ff2e93; color: white; }

  /* ===== GURT AI VISUALS ===== */
  #gurt {
    position: fixed; bottom: 30px; right: 40px; width: 140px;
    z-index: 1001; cursor: pointer;
    animation: spinGurt 15s linear infinite;
  }
  @keyframes spinGurt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes thinkGurt { 0% { transform: scale(1); } 50% { transform: scale(1.2) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }

  .speech-bubble {
    position: fixed; bottom: 180px; right: 40px; width: 220px;
    padding: 15px; background: white; border-radius: 20px;
    color: #ff2e93; font-size: 14px; z-index: 6;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid #ff2e93;
  }

  #gurt-chat-window {
    position: fixed; bottom: 100px; right: 30px; width: 320px; height: 450px;
    background: white; border: 4px solid #ff2e93; border-radius: 25px;
    display: none; flex-direction: column; z-index: 1005; overflow: hidden;
    box-shadow: 0 15px 40px rgba(255, 46, 147, 0.4);
  }
  .chat-header { background: #ff2e93; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  #chat-history { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fffafc; }
  .msg { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; }
  .msg.user { background: #ffcae5; align-self: flex-end; color: #d40070; border-bottom-right-radius: 2px; }
  .msg.gurt { background: #f0f0f0; align-self: flex-start; color: #333; border-bottom-left-radius: 2px; border: 1px solid #ffcae5; }
  .chat-input-area { padding: 12px; border-top: 2px solid #ffcae5; display: flex; gap: 8px; background: white; }
  .chat-input-area input { flex: 1; border: 2px solid #ffcae5; border-radius: 20px; padding: 10px 15px; outline: none; font-family: inherit; }
  .chat-input-area button { background: #ff2e93; border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: bold; }

  .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
  .modal-content { background: white; margin: 10% auto; padding: 30px; width: 350px; border-radius: 25px; text-align: center; border: 4px solid #ff2e93; }
  .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 2px solid #ffcae5; box-sizing: border-box; }
</style>
</head>
<body>

<div class="feed-stars" id="star-bg"></div>

<div class="container">
  <div class="left-panel">
    <img src="logo.PNG" class="logo" alt="OurWorlds" onclick="loadFeed()" style="cursor:pointer;">
    <div class="user-profile">
      <img src="user.png" id="userPfp">
      <div id="display-username">@Guest</div>
    </div>
    <button onclick="openProfile()">Profile</button>
    <button onclick="openFriends()">Friends</button>
    <button onclick="openWorlds()">Worlds</button>
   <button onclick="openConstellations()">Constellations</button>
    <button onclick="toggleChat()">Talk to Gurt!</button>
    <button onclick="logout()">Sign Out</button>
  </div>

  <div class="main-feed">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search the galaxy..." onkeyup="handleSearch(event)">
    </div>
    <div class="post-box">
      <textarea id="postContent" rows="3" placeholder="What's happening in your world?"></textarea>
      <button onclick="submitPost()">Post ✨</button>
      <div style="clear:both;"></div>
    </div>
    <div id="feed-container"></div>
  </div>

  <div class="right-space">
    <div class="speech-bubble">
      <strong id="gurt-status">✨ Star Wisdom:</strong>
      <p id="affirmation-text">Receiving signal...</p>
    </div>
    <img src="gurtHOMEPAGE.png" id="gurt" onclick="toggleChat()">
  </div>
</div>

<div id="gurt-chat-window">
  <div class="chat-header">
    <span>✨ Gurt Chat</span>
    <span style="cursor:pointer; font-size: 20px;" onclick="toggleChat()">×</span>
  </div>
  <div id="chat-history">
    <div class="msg gurt">Meow! Use the radio to talk to me! 🐾</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="gurtInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">➔</button>
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-content">
    <h2 style="color:#ff2e93;">Edit Profile ✨</h2>
    <input type="text" id="newDisplayName" placeholder="Display Name">
    <input type="text" id="newPfpUrl" placeholder="Profile Image URL">
    <div style="margin-top:15px;">
      <button onclick="saveProfile()" id="saveBtn" style="background:#ff2e93; color:white; padding:10px 20px; border:none; border-radius:15px; cursor:pointer;">Save</button>
      <button onclick="closeProfile()" style="background:#ccc; color:white; padding:10px 20px; border:none; border-radius:15px; cursor:pointer; margin-left:10px;">Cancel</button>
    </div>
  </div>
</div>

<div id="friendsModal" class="modal">
  <div class="modal-content">
    <h2 style="color:#ff2e93;">My Friends 🐾</h2>
    <div id="friendsListContainer" style="max-height: 200px; overflow-y: auto;"></div>
    <button onclick="document.getElementById('friendsModal').style.display='none'" style="margin-top:10px;">Close</button>
  </div>
</div>

<div id="worldsModal" class="modal">
  <div class="modal-content">
    <h2 style="color:#ff2e93;">Explore Worlds 🪐</h2>
    <p style="font-size: 0.9em; color: #666;">Click a world to enter it</p>
    <div id="worldsListContainer" style="max-height: 250px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px;">
      <!-- Hashtags will appear here -->
    </div>
    <button onclick="document.getElementById('worldsModal').style.display='none'" style="margin-top:10px;">Close</button>
  </div>
</div>


  <!-- DM Chat Window -->
<div id="dm-window" style="position: fixed; bottom: 20px; right: 360px; width: 300px; height: 400px; background: white; border: 4px solid #ff2e93; border-radius: 25px; display: none; flex-direction: column; z-index: 1010; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
  <div class="chat-header" style="background: #ff2e93; color: white; padding: 10px; border-top-left-radius: 15px; border-top-right-radius: 15px; display: flex; justify-content: space-between;">
    <span id="dm-target-name">Chatting with...</span>
    <span style="cursor:pointer;" onclick="closeDM()">×</span>
  </div>
  <div id="dm-history" style="flex: 1; padding: 10px; overflow-y: auto; background: #fffafc; display: flex; flex-direction: column; gap: 8px;">
    <!-- Messages appear here -->
  </div>
  <div class="chat-input-area" style="padding: 10px; display: flex; gap: 5px;">
    <input type="text" id="dmInput" placeholder="Send a message..." style="flex:1; border-radius: 15px; border: 1px solid #ffcae5; padding: 5px 10px;">
    <button onclick="sendDM()" style="background: #ff2e93; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">➔</button>
  </div>
</div>

  
  
<script>
  const API_URL = "http://192.168.174.129:3000";
  const currentUser = localStorage.getItem("username") || "Guest";

  function createStars() {
    const bg = document.getElementById('star-bg');
    for(let i=0; i<20; i++) {
        let s = document.createElement('span');
        s.textContent = i % 2 === 0 ? "☆" : "★";
        s.style.left = Math.random() * 100 + "%";
        s.style.animationDuration = (Math.random() * 5 + 5) + "s";
        s.style.animationDelay = Math.random() * 5 + "s";
        bg.appendChild(s);
    }
  }

  function toggleChat() {
    const win = document.getElementById("gurt-chat-window");
    win.style.display = (win.style.display === "flex") ? "none" : "flex";
  }

  async function sendChat() {
    const input = document.getElementById("gurtInput");
    const history = document.getElementById("chat-history");
    const gurtImg = document.getElementById("gurt");
    const val = input.value.trim();
    if(!val) return;

    history.innerHTML += `<div class="msg user">${val}</div>`;
    input.value = "";
    history.scrollTop = history.scrollHeight;
    gurtImg.style.animation = "thinkGurt 1s infinite linear";

    try {
      const res = await fetch(`${API_URL}/chat-with-gurt`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: val })
      });
      const data = await res.json();
      history.innerHTML += `<div class="msg gurt">${data.reply}</div>`;
    } catch (e) {
      history.innerHTML += `<div class="msg gurt">Error: Radio signal lost!</div>`;
    } finally {
      gurtImg.style.animation = "spinGurt 15s infinite linear";
      history.scrollTop = history.scrollHeight;
    }
  }

  function openProfile() { document.getElementById("profileModal").style.display = "block"; }
  function closeProfile() { document.getElementById("profileModal").style.display = "none"; }
  
  async function saveProfile() {
    const newName = document.getElementById("newDisplayName").value;
    const newPic = document.getElementById("newPfpUrl").value;
    await fetch(`${API_URL}/update-profile`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: currentUser, displayName: newName, profileIcon: newPic })
    });
    if(newName) localStorage.setItem("displayName", newName);
    if(newPic) localStorage.setItem("pfpUrl", newPic);
    location.reload();
  }

  async function loadFeed() {
    // This ensures the page always knows who YOU are from your browser's storage
    const savedName = localStorage.getItem("displayName");
    const savedPfp = localStorage.getItem("pfpUrl");
    
    // Update the sidebar with your specific info
    document.getElementById("display-username").textContent = "@" + (savedName || currentUser);
    if(savedPfp) document.getElementById("userPfp").src = savedPfp;

    try {
      // Pass the currentUser to the search so the backend knows who is asking
      const res = await fetch(`${API_URL}/search?q=&viewer=${currentUser}`);
      const data = await res.json();
      renderPosts(data.posts);
    } catch (e) { 
      console.log("Feed offline"); 
    }

    loadStarWisdom(); 
}
  async function loadStarWisdom() {
    try {
        const res = await fetch(`https://zenquotes.io/api/random`);
        const data = await res.json();
        const quote = data[0].q;
        const author = data[0].a;

        const affirmationBox = document.getElementById("affirmation-text");
        
        // This updates the text AND adds the bookmark button
        affirmationBox.innerHTML = `
            "${quote}" <br> 
            <small style="opacity: 0.8;">— ${author}</small>
            <div style="margin-top:10px;">
                <button onclick="saveQuoteToConstellations('${quote.replace(/'/g, "\\'")}', '${author}')" 
                        style="background:none; border:none; cursor:pointer; font-size:1.2em;" 
                        title="Save to Constellations">✨</button>
            </div>
        `;
    } catch (e) {
        document.getElementById("affirmation-text").textContent = "The stars are quiet tonight...";
    }
}

function renderPosts(posts) {
    const container = document.getElementById("feed-container");
    container.innerHTML = "";
    posts.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(p => {
        const starred = p.stars && p.stars.includes(currentUser);
        const displayName = p.authorDisplayName || p.author;

        // This checks if the post was made by "Guest" while you are logged in as "Guest"
        const isOwner = p.author === currentUser;

        container.innerHTML += `
            <div class="feed-post" style="position: relative;">
                <div class="post-header">
                    <img src="${p.authorIcon || 'user.png'}"> 
                    <strong>@${displayName}</strong>
                    <span class="add-friend-icon" onclick="addFriend('${p.author}')" title="Add Friend">➕</span>
                    
                    <!-- The Delete Button -->
                    ${isOwner ? `<span onclick="deletePost('${p._id}')" 
                          style="margin-left: auto; cursor: pointer; color: #ffcae5; font-weight: bold; font-size: 1.2em;" 
                          onmouseover="this.style.color='#ff2e93'" 
                          onmouseout="this.style.color='#ffcae5'">×</span>` : ''}
                </div>
                <div style="padding: 5px 0;">${p.content}</div>
                
                <button class="star-btn ${starred ? 'active' : ''}" onclick="starPost('${p._id}')">
                    ${starred ? '★' : '☆'} ${p.stars ? p.stars.length : 0}
                </button>
            </div>`;
    });
}

  async function openWorlds() {
    document.getElementById("worldsModal").style.display = "block";
    const container = document.getElementById("worldsListContainer");
    container.innerHTML = "Scanning the stars...";

    try {
        const res = await fetch(`${API_URL}/search?q=`);
        const data = await res.json();
        
        // Collect all hashtags from every post
        let allTags = [];
        data.posts.forEach(p => {
            const tags = p.content.match(/#[a-z0-9_]+/gi);
            if(tags) allTags.push(...tags);
        });

        // Remove duplicates and sort
        const uniqueTags = [...new Set(allTags)].sort();

        if (uniqueTags.length === 0) {
            container.innerHTML = "No worlds discovered yet. Create one with a #hashtag!";
        } else {
            container.innerHTML = uniqueTags.map(tag => `
                <span onclick="enterWorld('${tag}')" 
                      style="background: #ffcae5; color: #ff2e93; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;"
                      onmouseover="this.style.background='#ff2e93'; this.style.color='white'"
                      onmouseout="this.style.background='#ffcae5'; this.style.color='#ff2e93'">
                    ${tag}
                </span>
            `).join('');
        }
    } catch (e) {
        container.innerHTML = "Error reaching the Worlds.";
    }
}

async function enterWorld(tag) {
    document.getElementById("worldsModal").style.display = "none";
    // Reuse your search logic to filter the feed by the hashtag
    const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(tag)}`);
    const data = await res.json();
    renderPosts(data.posts);
    
    // Optional: add a little alert to show which world you're in
    console.log("Welcome to World: " + tag);
}

  async function submitPost() {
    const content = document.getElementById("postContent").value;
    if(!content) return;

    // regex to find hashtags: looks for # followed by alphanumeric characters
    const hashtags = content.match(/#[a-z0-9_]+/gi) || [];

    await fetch(`${API_URL}/post`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        username: currentUser, 
        content,
        tags: hashtags // Send the tags to the backend
      })
    });
    
    document.getElementById("postContent").value = "";
    loadFeed();
}

 async function starPost(postId) {
    try {
        const res = await fetch(`${API_URL}/star-post`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: currentUser, postId })
        });

        if (res.ok) {
            // Refresh the feed to show the updated star count and icon state
            loadFeed();
        }
    } catch (e) {
        console.error("Error toggling star:", e);
    }
}

  async function handleSearch(e) {
    if(e.key === "Enter") {
        const q = document.getElementById("searchInput").value;
        const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderPosts(data.posts);
    }
  }

  function logout() { localStorage.clear(); window.location.href = "index.html"; }

  window.onload = () => {
    createStars();
    loadFeed();
  };

async function deletePost(postId) {
    if (!confirm("Remove this test post from the galaxy?")) return;

    try {
        const res = await fetch(`${API_URL}/delete-post/${postId}`, {
            method: "DELETE"
        });

        if (res.ok) {
            // Reload the feed so the post disappears immediately
            loadFeed();
        } else {
            alert("The server couldn't delete this post.");
        }
    } catch (e) {
        console.error("Delete error:", e);
        alert("Check if your backend server is running!");
    }
}

  
  // --- FRIEND LOGIC ---
async function addFriend(targetUser) {
    if (currentUser === targetUser) return alert("You can't add yourself!");
    
    const res = await fetch(`${API_URL}/add-friend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: currentUser, friendName: targetUser })
    });
    alert(await res.text());
}

async function openFriends() {
    const container = document.getElementById("friendsListContainer");
    document.getElementById("friendsModal").style.display = "block";
    container.innerHTML = "Loading friends...";

    const res = await fetch(`${API_URL}/friends-list/${currentUser}`);
    const friends = await res.json();
    
    container.innerHTML = friends.length ? 
        friends.map(f => `
            <div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                <span>👤 @${f}</span>
                <button onclick="openDM('${f}')" style="background:#ff2e93; color:white; border:none; border-radius:15px; cursor:pointer; padding:5px 12px; font-size:0.8em;">Message</button>
            </div>`).join('') : 
        "No friends added yet.";
}

  let currentChatPartner = "";

function openDM(friendName) {
    currentChatPartner = friendName;
    document.getElementById("dm-target-name").textContent = "✨ Chat: " + friendName;
    document.getElementById("dm-window").style.display = "flex";
    document.getElementById("friendsModal").style.display = "none"; // Close the friends list to clean up the screen
    loadDMs();
}

function closeDM() {
    document.getElementById("dm-window").style.display = "none";
    currentChatPartner = "";
}

async function sendDM() {
    const input = document.getElementById("dmInput");
    const msg = input.value.trim();
    if (!msg || !currentChatPartner) return;

    // We send this to a new endpoint: /send-dm
    await fetch(`${API_URL}/send-dm`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            sender: currentUser,
            recipient: currentChatPartner,
            content: msg
        })
    });

    input.value = "";
    loadDMs(); // Refresh the chat window
}

async function loadDMs() {
    if (!currentChatPartner) return;
    const res = await fetch(`${API_URL}/get-dms/${currentUser}/${currentChatPartner}`);
    const messages = await res.json();
    
    const history = document.getElementById("dm-history");
    history.innerHTML = messages.map(m => {
        const isMe = m.sender === currentUser;
        return `
            <div style="align-self: ${isMe ? 'flex-end' : 'flex-start'}; 
                        background: ${isMe ? '#ffcae5' : '#eee'}; 
                        padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 13px;">
                ${m.content}
            </div>
        `;
    }).join('');
    history.scrollTop = history.scrollHeight;
}

// --- CONSTELLATION (BOOKMARK) LOGIC ---
async function openConstellations() {
    try {
        // 1. Fetch all posts from your backend
        const res = await fetch(`${API_URL}/search?q=`);
        const data = await res.json();
        
        // 2. Filter for items that belong in your "Constellation"
        // We look for:
        // - Posts where your username is in the "stars" array
        // - Posts that are specifically "Saved Wisdom" quotes you created
        const myConstellation = data.posts.filter(p => {
            const isStarred = p.stars && p.stars.includes(currentUser);
            const isSavedQuote = p.content.includes("Saved Wisdom:");
            return isStarred || isSavedQuote;
        });

        // 3. Show a message if it's empty, otherwise render them!
        if (myConstellation.length === 0) {
            alert("Your constellation is empty! Star a post or save a quote to see it here.");
        } else {
            // This re-uses your existing renderPosts function to display the filtered list
            renderPosts(myConstellation);
            
            // Optional: Scroll to top so the user sees the results
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    } catch (e) {
        console.error("Error loading constellations:", e);
        alert("Could not connect to the galaxy to retrieve your constellations.");
    }
}
