<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurWorlds - Home</title>
    <style>
        :root { --primary: #ff2e93; --bg: #f0f2f5; --text: #1c1e21; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; }

        /* Left Sidebar */
        .sidebar { width: 250px; height: 100vh; background: white; border-right: 1px solid #ddd; position: fixed; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .nav-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: 500; transition: 0.2s; text-decoration: none; color: inherit; }
        .nav-item:hover { background: #f2f2f2; }
        .nav-item.active { color: var(--primary); background: #fff0f6; }

        /* Main Content Area */
        main { margin-left: 280px; width: 600px; padding: 20px; }
        
        /* Post Box */
        .post-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 16px; resize: none; box-sizing: border-box; }
        .post-btn { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 20px; cursor: pointer; font-weight: bold; float: right; margin-top: 10px; transition: 0.3s; }
        .post-btn:hover { opacity: 0.9; }

        /* Feed */
        .feed-post { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-header img { width: 45px; height: 45px; border-radius: 50%; background: #eee; }
        .post-content { font-size: 16px; line-height: 1.5; margin-bottom: 15px; }

        /* Star Button */
        .star-action { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 14px; border-radius: 18px; border: 1px solid #ffcae5; background: #fff0f6; color: var(--primary); font-weight: bold; }
        .star-action:hover { background: #ffdef0; }

        /* Right Panel (Trending/Friends) */
        .right-panel { width: 300px; margin-left: 30px; padding-top: 20px; position: sticky; top: 0; }
        .panel-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .panel-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Sidebar Restored -->
    <nav class="sidebar">
        <div class="logo">OurWorlds</div>
        <a href="#" class="nav-item active">🏠 Home</a>
        <a href="#" class="nav-item">🔭 Explore</a>
        <a href="#" class="nav-item">✨ Constellations</a>
        <a href="profile.html" class="nav-item">👤 Profile</a>
        <a href="index.html" class="nav-item" onclick="localStorage.clear()">🚪 Logout</a>
    </nav>

    <main>
        <div class="post-box">
            <textarea id="postContent" placeholder="What's happening?"></textarea>
            <button class="post-btn" onclick="submitPost()">Post</button>
            <div style="clear:both;"></div>
        </div>

        <div id="feedContainer">
            <div style="text-align:center; color:#888;">Synchronizing with the universe...</div>
        </div>
    </main>

    <!-- Right Panel Restored -->
    <div class="right-panel">
        <div class="panel-box">
            <div class="panel-title">Trending Hashtags</div>
            <div style="color: var(--primary); cursor: pointer;">#OurWorlds #NodeJS #VM3</div>
        </div>
        <div class="panel-box">
            <div class="panel-title">Friends Online</div>
            <div id="friendsList" style="font-size: 14px; color: #666;">No friends online yet.</div>
        </div>
    </div>

    <script>
        const API_URL = "http://192.168.254.129:3000";
        const currentUser = localStorage.getItem("ourworlds_user") || "Guest";

        async function loadFeed() {
            try {
                const res = await fetch(`${API_URL}/search?q=`);
                const data = await res.json();
                const container = document.getElementById("feedContainer");
                container.innerHTML = "";

                if (!data.posts || data.posts.length === 0) {
                    container.innerHTML = "<div style='text-align:center; padding:20px; color:#888;'>The world is quiet... for now.</div>";
                    return;
                }

                data.posts.reverse().forEach(p => {
                    const isStarred = p.stars && p.stars.includes(currentUser);
                    const starIcon = isStarred ? "★" : "☆";
                    const starCount = p.stars ? p.stars.length : 0;

                    container.innerHTML += `
                        <div class="feed-post">
                            <div class="post-header">
                                <img src="user.png">
                                <div>
                                    <strong>@${p.author}</strong><br>
                                    <small style="color:#888;">${new Date(p.timestamp).toLocaleTimeString()}</small>
                                </div>
                            </div>
                            <div class="post-content">${p.content}</div>
                            <div class="star-action" onclick="starPost('${p._id}')">
                                <span>${starIcon}</span>
                                <span>${starCount}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById("feedContainer").innerHTML = "<div style='color:red;'>Failed to reach VM3 database.</div>";
            }
        }

        async function submitPost() {
            const content = document.getElementById("postContent").value;
            if (!content) return;

            try {
                const res = await fetch(`${API_URL}/post`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: currentUser, content: content })
                });

                if (res.ok) {
                    document.getElementById("postContent").value = "";
                    loadFeed();
                }
            } catch (err) {
                alert("Error connecting to server.");
            }
        }

        async function starPost(postId) {
            try {
                const res = await fetch(`${API_URL}/star-post`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: currentUser, postId: postId })
                });
                if (res.ok) loadFeed();
            } catch (err) {
                console.error("Starring failed");
            }
        }

        // Initial load
        loadFeed();
    </script>
</body>
</html>
