<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OurWorlds Home ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(to bottom, #ffffff, #ff4da6);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND ANIMATIONS ===== */
  .feed-stars {
    position: absolute; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .feed-stars span {
    position: absolute; color: #ffffff; font-size: 20px;
    opacity: 0.3; animation: fallFeed linear infinite;
  }
  @keyframes fallFeed {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 0.3; }
    100% { transform: translateY(110vh); opacity: 0.3; }
  }

  /* ===== PAGE LAYOUT ===== */
  .container { display: flex; flex: 1; gap: 20px; padding: 20px; z-index: 1; }

  /* ===== LEFT SIDEBAR ===== */
  .left-panel {
    width: 220px; background: #ff2e93; border-radius: 25px;
    border: 3px solid white; box-shadow: 0 0 25px rgba(255,255,255,0.7);
    padding: 20px; position: relative; overflow: hidden; flex-shrink: 0; height: fit-content;
  }
  .panel-stars span {
    position: absolute; color: #d40070; font-size: 40px;
    opacity: 0.4; animation: fallPanel 12s linear infinite;
  }
  @keyframes fallPanel {
    0% { transform: translateY(-60px); opacity: 0; }
    100% { transform: translateY(800px); opacity: 0.4; }
  }

  .logo { width: 100%; margin-bottom: 15px; position: relative; z-index: 2; }
  .user-profile { text-align: center; margin-bottom: 20px; position: relative; z-index: 2; color: white; }
  .user-profile img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid white; background: white; }

  .left-panel button {
    width: 100%; margin: 10px 0; padding: 12px; border: none; border-radius: 30px;
    font-weight: bold; color: white; background: linear-gradient(to bottom, #ff8acc, #ff2e93);
    cursor: pointer; box-shadow: 0 5px #d40070, 0 -2px 6px rgba(255,255,255,0.3) inset;
    transition: 0.2s; position: relative; z-index: 2; font-family: 'Quicksand', sans-serif;
  }
  .left-panel button:hover { transform: translateY(-2px); box-shadow: 0 7px #d40070, 0 -2px 8px rgba(255,255,255,0.4) inset; }

  /* ===== MAIN FEED AREA ===== */
  .main-feed { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 600px; margin: 0 auto; }
  .search-bar { width: 100%; margin-bottom: 20px; }
  .search-bar input {
    width: 100%; padding: 15px; border-radius: 30px; border: 3px solid #ff2e93;
    outline: none; font-family: inherit; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .post-box {
    width: 100%; background: white; border-radius: 20px; padding: 20px;
    margin-bottom: 25px; box-shadow: 0 8px 20px rgba(255,77,166,0.2); box-sizing: border-box;
  }
  .post-box textarea {
    width: 100%; border-radius: 15px; border: 2px solid #ffcae5; padding: 15px;
    font-family: inherit; resize: none; box-sizing: border-box; outline: none;
  }
  .post-box button {
    margin-top: 10px; background: #ff2e93; color: white; border: none;
    padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; float: right;
  }

  .feed-post {
    width: 100%; background: white; border-radius: 20px; padding: 20px;
    margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #444; box-sizing: border-box;
  }
  .post-header { display: flex; align-items: center; margin-bottom: 12px; }
  .post-header img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 2px solid #ff2e93; }
  .post-header strong { color: #ff2e93; }

  /* ===== RIGHT SIDE (GURT & LIVE API WISDOM) ===== */
  .right-space { width: 250px; position: relative; }
  #gurt {
    position: fixed; bottom: 30px; right: 40px; width: 140px;
    z-index: 5; opacity: 0.8; animation: spinGurt 12s linear infinite;
  }
  @keyframes spinGurt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .speech-bubble {
    position: fixed; bottom: 180px; right: 40px; width: 200px;
    padding: 15px; background: #ffffff; border-radius: 20px;
    color: #ff2e93; font-size: 14px; z-index: 6;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid #ff2e93;
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -12px; right: 50px;
    border-width: 12px 12px 0; border-style: solid; border-color: #ff2e93 transparent;
  }
</style>
</head>
<body>

<div class="feed-stars">
  <span style="left:5%; animation-duration:10s;">☆</span>
  <span style="left:25%; animation-duration:11s;">☆</span>
  <span style="left:55%; animation-duration:10s;">★</span>
  <span style="left:85%; animation-duration:14s;">☆</span>
</div>

<div class="container">
  <!-- SIDEBAR -->
  <div class="left-panel">
    <div class="panel-stars"><span style="left:10%;">★</span><span style="left:60%;">★</span></div>
    <img src="logo.PNG" class="logo">
    <div class="user-profile">
      <img src="user.png" id="userPfp">
      <div id="display-username">@Guest</div>
    </div>
    <button onclick="alert('Profile Coming Soon!')">Profile</button>
    <button onclick="alert('Friends Coming Soon!')">Friends</button>
    <button onclick="alert('Worlds!')">Worlds</button>
    <button onclick="alert('Bookmarks!')">Bookmarks</button>
    <button onclick="logout()">Sign Out</button>
  </div>

  <!-- FEED -->
  <div class="main-feed">
    <div class="search-bar"><input type="text" id="searchInput" placeholder="Search the galaxy..." onkeyup="handleSearch(event)"></div>
    <div class="post-box">
      <textarea id="postContent" rows="3" placeholder="What's happening in your world?"></textarea>
      <button onclick="submitPost()">Post ✨</button>
    </div>
    <div id="feed-container"></div>
  </div>

  <!-- GURT & LIVE API WISDOM -->
  <div class="right-space">
    <div class="speech-bubble">
      <strong style="display:block; margin-bottom: 5px;">✨ Star Wisdom:</strong>
      <p id="affirmation-text">Receiving a signal from the stars...</p>
    </div>
    <img src="gurtHOMEPAGE.png" id="gurt">
  </div>
</div>

<script>
  const API_URL = "http://192.168.254.129:3000";
  const currentUser = localStorage.getItem("username") || "Guest";
  document.getElementById("display-username").textContent = "@" + currentUser;

  // --- GENUINE EXTERNAL API CALL ---
  async function fetchStarWisdom() {
    const textElement = document.getElementById("affirmation-text");
    try {
      // Calling the Advice Slip API (Free, Public, No Key)
      const response = await fetch('https://api.adviceslip.com/advice');
      const data = await response.json();
      textElement.textContent = `"${data.slip.advice}"`;
    } catch (error) {
      textElement.textContent = "The stars are quiet tonight, but you are still amazing! ✨";
    }
  }

  async function submitPost() {
    const content = document.getElementById("postContent").value;
    if(!content) return;
    try {
      const res = await fetch(`${API_URL}/post`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: currentUser, content })
      });
      if(res.ok) { document.getElementById("postContent").value = ""; loadFeed(); }
    } catch (e) { alert("Backend offline!"); }
  }

  async function loadFeed() {
    try {
      const res = await fetch(`${API_URL}/search?q=`);
      const data = await res.json();
      const container = document.getElementById("feed-container");
      container.innerHTML = "";
      data.posts.reverse().forEach(p => {
        container.innerHTML += `
          <div class="feed-post">
            <div class="post-header"><img src="user.png"><strong>@${p.author}</strong></div>
            <div>${p.content}</div>
          </div>`;
      });
    } catch (e) { container.innerHTML = "<p style='color:white;'>Backend check failed.</p>"; }
  }

  async function handleSearch(event) {
    if (event.key === "Enter") {
      const q = document.getElementById("searchInput").value;
      const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      const container = document.getElementById("feed-container");
      container.innerHTML = `<h3 style="color:white;">Results for "${q}"</h3>`;
      data.posts.forEach(p => {
        container.innerHTML += `<div class="feed-post"><strong>@${p.author}</strong>: ${p.content}</div>`;
      });
    }
  }

  function logout() { localStorage.clear(); window.location.href ="index.html"; }

  window.onload = () => {
    loadFeed();
    fetchStarWisdom(); // Hits the external API on every refresh
  };
</script>
</body>
</html>
